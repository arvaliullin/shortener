services:
  redis:
    image: redis:8.8.1
    container_name: shortener-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  shortener:
    build:
      context: ..
      dockerfile: build/shortener.Dockerfile
    container_name: shortener
    ports:
      - "8080:8080"
    environment:
      REDIS_ADDR: redis:6379
      BASE_URL: https://localhost:8443
      KEYCLOAK_ISSUER: https://localhost:8443/realms/shortener
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/shortener/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: shortener-web
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  agent:
    build:
      context: ..
      dockerfile: build/agent.Dockerfile
    container_name: shortener-agent
    environment:
      AGENT_ADDRESS: :8090
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: qwen2.5:1.5b
      MCP_URL: http://shortener:8080/mcp
      KEYCLOAK_ISSUER: https://localhost:8443/realms/shortener
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/shortener/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: shortener-web
    depends_on:
      ollama:
        condition: service_healthy
      shortener:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: build/web.Dockerfile
    container_name: shortener-web
    ports:
      - "8443:443"
    volumes:
      - ../certs:/etc/nginx/certs:ro
    depends_on:
      shortener:
        condition: service_healthy
      agent:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    container_name: shortener-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: https://localhost:8443
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    restart: unless-stopped

volumes:
  redis-data:
  ollama:
    name: ollama
    external: true
